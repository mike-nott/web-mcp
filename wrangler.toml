# web-mcp — thin MCP server for walled web content (Reddit, X).
#
# Secrets (set once with `echo "value" | wrangler secret put NAME`):
#   MCP_AUTH_TOKEN, REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, TWITTERAPI_IO_KEY,
#   FIRECRAWL_API_KEY, YOUTUBE_API_KEY, SUPADATA_API_KEY, EXA_API_KEY, BRAVE_API_KEY,
#   TAVILY_API_KEY
# Local dev reads the same names from .dev.vars (gitignored).
# Deploying? See README — replace the KV namespace id below with your own.

name = "web-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
REDDIT_USER_AGENT = "cf-worker:web-mcp:v1 (contact: mike@nott.org)"
X_DAILY_CALL_LIMIT = "500"
FIRECRAWL_DAILY_CALL_LIMIT = "200"
# Google caps YouTube search at ~100/day in its own bucket; 90 leaves headroom.
# Video metadata and comments are 1 unit each against a separate 10,000/day pool
# and are deliberately not counted here.
YOUTUBE_SEARCH_DAILY_LIMIT = "90"
# Runaway backstop only — set well above normal use. A Supadata Pro plan is
# 3,000 credits/month, so this never binds in practice; set to "0" to disable.
# Worth keeping because generate:true bills per MINUTE of video (a 60-minute
# talk is ~120 credits), so one bad loop could eat a month's plan.
SUPADATA_DAILY_LIMIT = "300"
EXA_DAILY_CALL_LIMIT = "200"
BRAVE_DAILY_CALL_LIMIT = "500"
TAVILY_DAILY_LIMIT = "500"
# Which engine backs web_search mode "keyword": auto | tavily | brave | both.
# "auto" prefers Tavily (the only one with a free tier), falling back to Brave.
# "both" queries them in parallel and merges — better recall, and a URL found by
# both carries Brave's publication date AND Tavily's page text. Costs a query on
# each engine per search, so Tavily's free tier no longer covers usage.
KEYWORD_SEARCH_PROVIDER = "auto"

[[kv_namespaces]]
binding = "KV"
id = "f420d454b34a4bffbdde610ff23f71d5"
